# ================================================================
# File Management Application - Configuration Properties
# ================================================================

# Server Configuration
# ================================================================
# Port on which the application will run
server.port=8080

# Application name
spring.application.name=File Management Application

# JSP Configuration
# ================================================================
# Configure Spring to look for JSP files in the WEB-INF/views/ directory
spring.mvc.view.prefix=/WEB-INF/views/
# Set the view suffix to .jsp
spring.mvc.view.suffix=.jsp

# Logging Configuration
# ================================================================
# Set logging level for Spring Boot
logging.level.root=INFO
logging.level.com.filemanagement=DEBUG

# Logging pattern with timestamp, level, and message
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# File Upload Configuration
# ================================================================
# Maximum file size that can be uploaded (10MB)
spring.servlet.multipart.max-file-size=10MB
# Maximum request size (10MB)
spring.servlet.multipart.max-request-size=10MB

# ================================================================
# Application Notes:
# - This application uses JSP for the UI
# - No database is required
# - Files are stored in /application_files/upload directory
# - File metadata is stored in memory (using HashMap)
# ================================================================
