name: Build and Package Spring Boot Application

on:
    workflow_dispatch:
        inputs:
            skip_tests:
                description: 'Skip Tests?'
                type: boolean
                default: true
    push:
        branches:
            - main
            - develop
            - feature/**
permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest


        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4

            - name: Set up Java
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 17
                  cache: maven

            - name: Build JAR
              run: mvn clean package -DskipTests=${{ inputs.skip_tests || true }}